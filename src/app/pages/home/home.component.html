<h2>Olympic games app</h2>
<hr />

<ng-container *ngIf="countries() as countries">
  <div class="center">
    <div>{{ titlePage }}</div>
  </div>
  <div class="split">
    <div>
      <p>Number of countries</p>
      <p>{{ numberOfCountries() }}</p>
    </div>
    <div>
      <p>Number of JOs</p>
      <p>{{ numberOfJOs() }}</p>
    </div>
  </div>
</ng-container>

<canvas #dashboardPieChart [hidden]="!numberOfCountries()" width="400" height="300" style="min-width:400px;min-height:300px;display:block;background:#fff;border:1px solid #ccc" aria-label="Pie chart showing medals per country" role="img"></canvas>
<div *ngIf="!numberOfCountries()" class="center" role="status" aria-live="polite">No country data available.</div>
