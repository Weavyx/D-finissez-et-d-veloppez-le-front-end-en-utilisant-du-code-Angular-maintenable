<h2>Olympic games app</h2>
<hr />
<app-loading-indicator
  [@if]="loading"
  aria-live="polite"
  role="status"
></app-loading-indicator>
<app-error-message
  [@if]="error"
  [message]="error"
  aria-live="assertive"
  role="alert"
></app-error-message>
<div [@if]="!loading && !error">
  <div>
    <div class="center">
      <div>{{ titlePage }}</div>
    </div>
    <div class="split">
      <div>
        <p>Number of countries</p>
        <p>{{ totalCountries }}</p>
      </div>
      <div>
        <p>Number of JOs</p>
        <p>{{ totalJOs }}</p>
      </div>
    </div>
  </div>
  <canvas id="DashboardPieChart">{{ pieChart }}</canvas>
</div>
